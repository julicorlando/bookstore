{% extends 'core/base.html' %}
{% block title %}Entrar · Pulse{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="brand big">Pulse</div>
  <h1>Entre na sua conta</h1>
  <form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<button class="primary" type="submit">Entrar</button></form>
  <p>Não tem uma conta? <a href="{% url 'signup' %}">Cadastre-se</a></p>
</section>
{% endblock %}
