name: PR - Testes e Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    name: Quality check
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.14.3
        uses: actions/setup-python@v5
        with:
          python-version: 3.14.3

      - name: Instalar Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.3.2

      - name: Instalar dependências
        run: poetry install --no-root

      - name: Validar configuração do Django
        env:
          SECRET_KEY: "test_key"
          DEBUG: 1
          DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1"
          SQL_ENGINE: "django.db.backends.sqlite3"
          SQL_DATABASE: "db.sqlite3"
        run: poetry run python manage.py check

      - name: Executar testes
        env:
          SECRET_KEY: "test_key"
          DEBUG: 1
          DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1"
          SQL_ENGINE: "django.db.backends.sqlite3"
          SQL_DATABASE: "db.sqlite3"
        run: poetry run python manage.py test

      - name: Code Review automatizado
        uses: wemake-services/wemake-python-styleguide@1.8.0
        continue-on-error: true
        with:
          reporter: github-pr-review
          filter_mode: added
          fail_workflow: "0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
