name: Publicar imagem no Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - exercicio-docker-hub
    paths:
      - "docker-hello-world/**"
      - ".github/workflows/docker-hub.yml"

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: julicorlando
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-hello-world
          file: ./docker-hello-world/Dockerfile
          push: true
          tags: |
            julicorlando/ebac-docker-hello-world:1.0
            julicorlando/ebac-docker-hello-world:latest
