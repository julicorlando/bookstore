name: Projeto final - Twitter Clone

on:
  pull_request:
    paths:
      - "twitter_clone/**"
      - ".github/workflows/twitter-clone-ci.yml"
  push:
    branches: [main]
    paths:
      - "twitter_clone/**"
      - ".github/workflows/twitter-clone-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twitter_clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: twitter_clone/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar migrations
        run: python manage.py migrate --noinput
      - name: Django check
        run: python manage.py check
      - name: Executar testes
        run: python manage.py test
